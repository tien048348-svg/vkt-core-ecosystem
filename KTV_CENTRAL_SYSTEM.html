<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>KTV MULTI-ACTOR V9.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #f59e0b; --black: #050505; --dark: #111; --gray: #222; }
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: var(--black); color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; border: 2px solid var(--gold); border-radius: 20px; background: var(--dark); padding: 30px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 5px; margin: 0; }
        
        .api-status { font-size: 0.8rem; color: #555; }
        .api-input { background: #000; border: 1px solid #333; color: var(--gold); padding: 8px; border-radius: 5px; width: 300px; font-family: monospace; }

        /* Scene Card */
        .scene-card { background: #000; border: 1px solid #333; border-radius: 15px; padding: 20px; display: grid; grid-template-columns: 60px 1.5fr 1fr 200px; gap: 20px; margin-bottom: 20px; }
        .scene-card:hover { border-color: var(--gold); }
        .scene-id { font-size: 1.5rem; color: #333; font-weight: bold; }
        
        label { color: var(--gold); font-size: 0.7rem; font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 8px; }
        textarea { width: 100%; background: #111; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 12px; font-size: 0.95rem; resize: none; box-sizing: border-box; }
        
        select { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 5px; cursor: pointer; }

        /* Timer Sync */
        .sync-box { text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .timer { font-size: 1.2rem; font-weight: bold; font-family: monospace; margin-bottom: 5px; }
        .safe { color: #10b981; } .danger { color: #ef4444; }

        /* Actions */
        .actions { position: sticky; bottom: 20px; background: rgba(0,0,0,0.9); padding: 20px; border-radius: 15px; border: 1px solid var(--gold); display: flex; gap: 15px; backdrop-filter: blur(10px); z-index: 100; }
        button { flex: 1; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        #render-btn { background: var(--gold); color: #000; }
        #add-scene { background: #222; color: var(--gold); border: 1px dashed var(--gold); }
        #download-btn { background: #fff; color: #000; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>KTV MULTI-ACTOR ARCHITECT</h1>
        <div class="api-status">
            KEY: <input type="password" id="api-key" class="api-input" placeholder="Tự động lưu sau khi nhập...">
        </div>
    </div>

    <div id="scene-list">
        </div>

    <div class="actions">
        <button id="add-scene" onclick="addScene()">+ Thêm Cảnh (Mỗi cảnh 8s)</button>
        <button id="render-btn" onclick="renderAll()">Kích hoạt Toàn bộ Diễn viên</button>
        <button id="download-btn">Tải MP3 Đã Đồng Bộ</button>
    </div>
    
    <audio id="audio-player" style="display:none;"></audio>
</div>

<script>
    const voices = [
        { name: "[BẮC] Nam Minh (Uy nghi)", code: "vi-VN-Neural2-D", p: -2.0, r: 1.05 },
        { name: "[BẮC] Nữ Ban Mai (Thanh thoát)", code: "vi-VN-Neural2-A", p: 0.0, r: 1.0 },
        { name: "[NAM] Nam Gia Huy (Trầm ấm)", code: "vi-VN-Wavenet-C", p: -2.0, r: 1.0 },
        { name: "[NAM] Nữ Mỹ An (Ngọt ngào)", code: "vi-VN-Wavenet-A", p: 1.5, r: 1.0 },
        { name: "[CỔ NHÂN] Ông già (Huyền bí)", code: "vi-VN-Neural2-D", p: -8.0, r: 0.85 },
        { name: "[TRẺ EM] Bé trai (Tinh nghịch)", code: "vi-VN-Neural2-D", p: 15.0, r: 1.15 }
    ];

    let sceneCount = 0;
    let finalBlob = null;

    // Tự động lấy API Key từ bộ nhớ máy tính (LocalStorage)
    window.onload = () => {
        const savedKey = localStorage.getItem('ktv_api_key');
        if (savedKey) document.getElementById('api-key').value = savedKey;
        addScene(); // Khởi tạo cảnh đầu tiên
    };

    // Lưu API Key mỗi khi nhập
    document.getElementById('api-key').onchange = (e) => {
        localStorage.setItem('ktv_api_key', e.target.value);
    };

    function addScene() {
        sceneCount++;
        const list = document.getElementById('scene-list');
        const div = document.createElement('div');
        div.className = 'scene-card';
        div.id = `scene-${sceneCount}`;
        
        let voiceOptions = voices.map((v, i) => `<option value="${i}">${v.name}</option>`).join('');

        div.innerHTML = `
            <div class="scene-id">${sceneCount < 10 ? '0'+sceneCount : sceneCount}</div>
            <div class="input-group">
                <label>Lời thoại cảnh này</label>
                <textarea class="script-text" oninput="checkTime(${sceneCount})" placeholder="Nhập kịch bản..."></textarea>
            </div>
            <div class="voice-group">
                <label>Chọn Diễn viên</label>
                <select class="voice-select" onchange="checkTime(${sceneCount})">${voiceOptions}</select>
                <label style="margin-top:10px">Veo 3 Prompt</label>
                <textarea style="height:45px; font-size:0.7rem; color:#666;" placeholder="Mô tả hình ảnh..."></textarea>
            </div>
            <div class="sync-box">
                <div class="timer safe" id="time-${sceneCount}">0.0s</div>
                <div style="font-size:0.6rem; color:#444;">VEO 3 LIMIT: 8.0s</div>
            </div>
        `;
        list.appendChild(div);
    }

    function checkTime(id) {
        const card = document.getElementById(`scene-${id}`);
        const text = card.querySelector('.script-text').value;
        const voiceIdx = card.querySelector('.voice-select').value;
        const rate = voices[voiceIdx].r;
        
        const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
        const estimatedTime = (words * 0.4) / rate;
        
        const timer = document.getElementById(`time-${id}`);
        timer.innerText = estimatedTime.toFixed(1) + 's';
        timer.className = estimatedTime > 8.0 ? 'timer danger' : 'timer safe';
    }

    async function renderAll() {
        const key = document.getElementById('api-key').value;
        if(!key) return alert("HỆ THỐNG: Vui lòng nhập API Key!");

        const btn = document.getElementById('render-btn');
        btn.innerText = "ĐANG KẾT NỐI DIỄN VIÊN...";
        btn.disabled = true;

        const scenes = document.querySelectorAll('.scene-card');
        let audioChunks = [];

        try {
            for(let scene of scenes) {
                const text = scene.querySelector('.script-text').value;
                if(text.trim() === "") continue;

                const v = voices[scene.querySelector('.voice-select').value];
                const body = {
                    input: { text: text },
                    voice: { languageCode: "vi-VN", name: v.code },
                    audioConfig: { audioEncoding: "MP3", speakingRate: v.r, pitch: v.p }
                };

                const resp = await fetch(`https://texttospeech.googleapis.com/v1/text:synthesize?key=${key}`, {
                    method: 'POST',
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                audioChunks.push(b64toBlob(data.audioContent, 'audio/mp3'));
            }

            finalBlob = new Blob(audioChunks, { type: 'audio/mp3' });
            const player = document.getElementById('audio-player');
            player.src = URL.createObjectURL(finalBlob);
            player.play();
            document.getElementById('download-btn').style.display = 'block';
            btn.innerText = "XUẤT BẢN THÀNH CÔNG";
        } catch (e) {
            alert("LỖI: " + e.message);
        } finally {
            btn.disabled = false;
        }
    }

    function b64toBlob(b64, type) {
        const bin = atob(b64);
        const len = bin.length;
        const arr = new Uint8Array(len);
        for (let i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr], { type: type });
    }

    document.getElementById('download-btn').onclick = () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(finalBlob);
        a.download = `KTV_MASTER_SYNC_${new Date().getTime()}.mp3`;
        a.click();
    };
</script>
</body>
</html>
