<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKT-Invitation Architect v1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; }
        .vkt-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .preview-area { border: 2px dashed #cbd5e1; min-height: 400px; }
        @media print { .no-print { display: none; } .print-area { border: none; padding: 0; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <header class="mb-8 no-print">
            <h1 class="text-2xl font-bold text-gray-800">🚀 VKT-INVITATION ARCHITECT</h1>
            <p class="text-gray-500">Hệ thống tạo thư mời đa nhiệm - Chủ sở hữu: Anh Tiến (VKT System)</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Sidebar: Controls -->
            <div class="md:col-span-1 space-y-6 no-print">
                <div class="vkt-card p-5">
                    <label class="block text-sm font-bold text-gray-700 mb-2">CHỌN LOẠI THƯ MỜI</label>
                    <select id="typeSelector" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="buddhist">Giáo hội Phật giáo</option>
                        <option value="parents">Họp Phụ huynh</option>
                        <option value="teachers">Họp Giáo viên</option>
                    </select>
                </div>

                <div class="vkt-card p-5 space-y-4">
                    <label class="block text-sm font-bold text-gray-700">THÔNG TIN CHUNG</label>
                    <input type="text" id="subject" placeholder="Chủ đề cuộc họp" class="w-full p-2 border rounded-lg">
                    <input type="text" id="time" placeholder="Thời gian (Vd: 08h00 ngày...)" class="w-full p-2 border rounded-lg">
                    <input type="text" id="location" placeholder="Địa điểm" class="w-full p-2 border rounded-lg">
                    <textarea id="note" placeholder="Lưu ý thêm..." class="w-full p-2 border rounded-lg h-24"></textarea>
                    <button onclick="generateInvite()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">TẠO THƯ MỜI</button>
                </div>

                <button onclick="window.print()" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg no-print">IN THƯ MỜI / XUẤT PDF</button>
            </div>

            <!-- Preview Area -->
            <div class="md:col-span-2">
                <div class="vkt-card p-8 preview-area print-area" id="inviteOutput">
                    <div class="text-center text-gray-400 mt-20">
                        Nội dung thư mời sẽ hiển thị tại đây...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const templates = {
            buddhist: {
                header: "NAM MÔ BỔN SƯ THÍCH CA MÂU NI PHẬT",
                subHeader: "GIÁO HỘI PHẬT GIÁO VIỆT NAM",
                salutation: "Kính bạch Chư tôn đức, Kính thưa quý Phật tử,",
                closing: "Nguyện cầu hồng ân Tam Bảo gia hộ Chư tôn đức vô lượng an lạc."
            },
            parents: {
                header: "GIẤY MỜI HỌP PHỤ HUYNH",
                subHeader: "TRƯỜNG ....................................",
                salutation: "Kính gửi Quý phụ huynh học sinh,",
                closing: "Rất mong sự có mặt đông đủ của Quý phụ huynh để cùng thảo luận về tương lai các em."
            },
            teachers: {
                header: "THÔNG BÁO TRIỆU TẬP HỘI NGHỊ",
                subHeader: "BỘ PHẬN CHUYÊN MÔN",
                salutation: "Kính gửi Ban giám hiệu và toàn thể Giáo viên,",
                closing: "Đề nghị các đồng chí sắp xếp công việc để tham gia đầy đủ và đúng giờ."
            }
        };

        function generateInvite() {
            const type = document.getElementById('typeSelector').value;
            const subject = document.getElementById('subject').value || "[Chủ đề cuộc họp]";
            const time = document.getElementById('time').value || "....................";
            const location = document.getElementById('location').value || "....................";
            const note = document.getElementById('note').value || "....................";
            
            const theme = templates[type];
            
            let html = `
                <div class="text-center border-b pb-4 mb-6">
                    <h3 class="text-sm font-bold tracking-widest text-gray-600 uppercase">${theme.subHeader}</h3>
                    <h1 class="text-2xl font-bold mt-2 text-gray-900">${theme.header}</h1>
                </div>
                <div class="space-y-6 leading-relaxed text-gray-800">
                    <p class="italic">${theme.salutation}</p>
                    <p>Trân trọng kính mời quý vị đến tham dự buổi họp với nội dung: <strong class="text-blue-700">${subject}</strong></p>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <p>⏰ <strong>Thời gian:</strong> ${time}</p>
                        <p>📍 <strong>Địa điểm:</strong> ${location}</p>
                    </div>
                    <p><strong>Nội dung thảo luận/Lưu ý:</strong> ${note}</p>
                    <p class="mt-8">${theme.closing}</p>
                    <div class="mt-12 flex justify-between">
                        <div class="text-center italic text-sm">
                            (Phát hành từ VKT System)
                        </div>
                        <div class="text-center">
                            <p class="font-bold">BAN TỔ CHỨC</p>
                            <p class="text-sm text-gray-500 mt-8">(Ký và ghi rõ họ tên)</p>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('inviteOutput').innerHTML = html;
        }
    </script>
</body>
</html>
